name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  validate-mcp-servers:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install MCP dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mcp fastmcp pydantic

      - name: Syntax check all MCP servers
        run: |
          echo "Checking MCP server syntax..."
          for f in src/mcp_servers/*_mcp.py; do
            python -m py_compile "$f" && echo "OK: $f" || echo "FAIL: $f"
          done

  validate-skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate command files exist
        run: |
          echo "Checking skill command files..."
          for f in .claude/commands/sp.*.md; do
            [ -f "$f" ] && echo "OK: $f" || echo "MISSING: $f"
          done

      - name: Validate templates exist
        run: |
          echo "Checking templates..."
          for f in .specify/templates/*.md; do
            [ -f "$f" ] && echo "OK: $f" || echo "MISSING: $f"
          done

      - name: Validate bash scripts exist
        run: |
          echo "Checking scripts..."
          for f in .specify/scripts/bash/*.sh; do
            [ -f "$f" ] && echo "OK: $f" || echo "MISSING: $f"
            bash -n "$f" && echo "  Syntax OK" || echo "  Syntax ERROR"
          done

  backend-ci:
    name: Backend (lint + type + test)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: leadforge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
      - run: uv pip install --system -e ".[dev]"
      - run: ruff check src/
      - run: mypy src/
      - run: pytest --cov=app --cov-fail-under=80
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/leadforge_test
          SECRET_KEY: test-secret-key

  frontend-ci:
    name: Frontend (lint + type + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run type-check
      - run: npm run lint
      - run: npx vitest run
